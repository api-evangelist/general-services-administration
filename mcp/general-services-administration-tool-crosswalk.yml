      server: https://api.gsa.gov/travel/perdiem
      gated: false
      note: Requires an api.data.gov key; the document itself is public.
    - file: openapi/general-services-administration-regulations-gov-openapi.yaml
      server: https://api.regulations.gov/v4
      gated: false
      note: >-
        The document is public on open.gsa.gov, but every request to the host
