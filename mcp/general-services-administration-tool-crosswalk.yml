source: >-
  Derived by binding the tool sets of GSA-TTS/mcp-server-gsa-perdiem and
  GSA-TTS/mcp-server-regulations-gov to the operations in
  openapi/general-services-administration-per-diem-openapi.yaml and
  openapi/general-services-administration-regulations-gov-openapi.yaml.
description: >-
  Both GSA MCP servers are thin wrappers over a single published OpenAPI each,
  so the mapping is near one-to-one. Two facts fall out that neither artifact
  shows alone. First, NEITHER GSA spec declares operationId on the operations
  these tools call — per diem declares none at all, and Regulations.gov declares
  exactly one (GetSubmitterKey) across ten operations — so every binding below
  is addressed by method + path, which is what an agent is actually left with.
  Second, the per diem M&IE tool has no operation in the per diem OpenAPI: GSA
  documents GET /v2/rates/conus/mie/{year} on open.gsa.gov and on its own curl
  examples, but omitted it from the machine-readable contract. The MCP server is
  the only machine-readable place that endpoint exists.
