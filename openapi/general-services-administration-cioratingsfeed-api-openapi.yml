      summary: Retrieves the collection of CioRatingsFeed resources
      description: Retrieves the collection of CioRatingsFeed resources.
      parameters:
      - name: agency
        in: query
        description: Three digit agency code
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - '006'
          - '007'
          - 009
          - '010'
          - '011'
          - '012'
          - '014'
          - '015'
          - '016'
          - 018
          - 019
          - '020'
          - '021'
          - '023'
          - '024'
          - '025'
          - '026'
          - '027'
          - 028
          - 029
          - '100'
          - '184'
          - '202'
          - '393'
          - '422'
          - '429'
        style: form
        explode: false
        allowReserved: false
      - name: recentFilter
        in: query
        description: CioRating Recent Filter
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: bool
          enum:
          - 'true'
          - 'false'
        style: form
        explode: false
        allowReserved: false
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: integer
          default: 1
        style: form
        explode: false
        allowReserved: false
      - name: agency[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: agencyId
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: agencyId[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: sort[lastModified]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - asc
          - desc
        style: form
        explode: false
        allowReserved: false
      deprecated: false
components:
  schemas:
    CioRatingsFeed-read_cioRatingFeed:
      type: object
      description: ''
      properties:
        serviceId:
          readOnly: true
          description: The three digit agency code.
          type: string
        agency:
          readOnly: true
          description: The three digit agency code.
          type: string
        created:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Created date/time
        lastModified:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Last modified date/time
        agencyCode:
          type: string
          format: string
          example: 018
          description: The agency code of the user who created the record
        agencyId:
          description: A unique identifier for the document provided by the submitting user.
          type: string
        rating:
          type: number
          format: integer
          example: 5
          minimum: 1
          maximum: 5
          description: 'CIOs best judgment of the current level of risk for the Investment in terms of its ability

            to accomplish its goals (per 40 U.S.C. § 11315 (c)(2)).


            1 represents the lowest possible score and 5 represent the highest possible score.'
        comment:
          type: string
          format: string
          example: CIO Evaluation Report on 10/1/2020 produced a score of 5.
          description: Explanation and/or additional details regarding this reported value
        date:
          type: date
          format: string
          example: '2020-10-01'
          description: Provide the date of CIO Evaluation
