components:
  schemas:
    CioAuthority-read:
      type: object
      description: ''
      additionalProperties: false
      properties:
        agencyId:
          type: string
          format: alphanumeric
          minLength: 1
          maxLength: 64
          description: A unique identifier for the document provided by the submitting user.
        cioAuthority:
          type: float
          format: float
          example: 0.35
        budgetCode:
          type: string
          format: string
          example: 001-15-4607
        fiscalYear:
          type: integer
          format: year
          example: 2022
        agency:
          type: string
        isMasked:
          type: bool
          example: true
          readOnly: true
          description: A readonly boolean indicating whether the document is masked from the public.
          default: true
        created:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Created date/time
        lastModified:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Last modified date/time
        agencyCode:
          type: string
          format: string
          example: 018
          description: The agency code of the user who created the record
    CioAuthority-readItem:
      type: object
      description: ''
      additionalProperties: false
