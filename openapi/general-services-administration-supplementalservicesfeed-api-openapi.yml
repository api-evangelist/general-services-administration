openapi: 3.2.0
info:
  title: ITCollect Public By 2026 Supplemental Services Feed API
  version: 0.1-beta
  description: 'The IT Dashboard team aims to build a modern API that acts as the center-piece of a modular IT data reporting ecosystem. This OpenAPI spec shows the initial direction of ITCollect Public data architecture for budget year 2026, and it is aimed at providing real-time updates to the IT Collect Public By 2026 API. It will serve as living documentation of the latest changes.


    In order to access ITCollect Public Api, Please fill out the below form to obtain an authorization key


    Loading signup form...'
  x-logo:
    url: images/logo-gsa.svg
    backgroundColor: '#FFFFFF'
    altText: U.S General Services Administration
servers:
- url: /
  description: ''
tags:
- name: SupplementalServicesFeed
paths:
  /v1/feeds/reports/supplemental-services-feed:
    parameters: []
    get:
      operationId: getSupplementalServicesFeedCollection
      tags:
      - SupplementalServicesFeed
      responses:
        '200':
          description: SupplementalServicesFeed collection
          content:
            application/ld+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplementalServicesFeed-supplementalServicesFeed_supService'
            text/csv:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplementalServicesFeed-supplementalServicesFeed_supService'
        '400':
          description: Bad Request
          content:
            application/ld+json:
              schema:
                type: object
                properties:
                  '@context':
                    type: string
                    example: /contexts/ConstraintViolationList
                  '@type':
