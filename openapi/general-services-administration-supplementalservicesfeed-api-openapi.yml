      summary: Retrieves the collection of SupplementalServicesFeed resources
      description: Retrieves the collection of SupplementalServicesFeed resources.
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: integer
          default: 1
        style: form
        explode: false
        allowReserved: false
      - name: agencyId
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: agencyId[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: sort[lastModified]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - asc
          - desc
        style: form
        explode: false
        allowReserved: false
      deprecated: false
components:
  schemas:
    SupplementalServicesFeed-supplementalServicesFeed_supService:
      type: object
      description: ''
      properties:
        projectLifecycleCosts:
          type: string
        lastModified:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Last modified date/time
        agencyCode:
          type: string
          format: string
          example: 018
          description: The agency code of the user who created the record
        agencyId:
          type: string
          format: alphanumeric
          minLength: 1
          maxLength: 32
          description: A unique identifier for the document provided by the submitting user.
        currentUII:
          type: string
          format: string
          example: 018-000000123
          description: 'The Current UII includes an Agency code and a nine-digit unique identifier.

            Variable information formerly included in the UII of previous years is not part

            of the UII primary key.'
        title:
          type: string
          format: string
          example: IT Collect Development
          description: 'This is a text field to provide the Investment title. To the extent that they are not

            part of the name used by the Agency, other identifiers such as bureaus or other

            numeric codes should not be included as part of an Investment title.'
