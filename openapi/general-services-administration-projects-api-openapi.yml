components:
  schemas:
    Projects-read:
      type: object
      description: ''
      properties:
        agencyId:
          type: string
          format: alphanumeric
          minLength: 1
          maxLength: 64
          description: A unique identifier for the document provided by the submitting user.
        projectId:
          type: string
          format: string
          example: GSAProj1
          description: An Agency-specified alphanumeric code that uniquely identifies the project within the Investment.
        projectName:
          type: string
          format: string
          example: API Submissions Development
          maxLength: 100
          description: Name used by the Agency to refer specifically to the project.
        projectGoal:
          type: string
          format: string
          example: Develop a mechanism to collect CPIC data
          maxLength: 250
          description: 'Brief description of primary goal/outcome the project is planning to provide for the Investment

            upon completion. This field is masked from public view.'
        plannedStartDate:
          type:
          - string
          - 'null'
          format: date
          example: '2020-08-15'
          description: 'Enter the planned start date [YYYY-MM-DD] of this project.

            Modifying this field via PUT or PATCH operation will require a rebaseline'
        projectedStartDate:
          type:
          - string
          - 'null'
          format: date
          example: '2020-08-15'
          description: Enter the projected start date [YYYY-MM-DD] of this project.
        actualStartDate:
          type:
          - string
          - 'null'
          format: date
          example: '2020-08-15'
          description: Enter the actual start date [YYYY-MM-DD] of this project.
        plannedEndDate:
          type:
          - string
          - 'null'
          format: date
          example: '2020-11-20'
          description: 'Enter the planned end date [YYYY-MM-DD] of this project.

            Modifying this field via PUT or PATCH operation will require a rebaseline.'
        projectedEndDate:
          type:
          - string
          - 'null'
          format: date
          example: '2020-11-20'
          description: Enter the projected end date [YYYY-MM-DD] of this project.
        actualEndDate:
          type:
          - string
          - 'null'
          format: date
          example: '2020-11-20'
          description: Enter the actual end date [YYYY-MM-DD] of this project.
        plannedTotalCost:
          type:
          - number
          - 'null'
          format: decimal
          example: 100
          description: 'Enter the planned total cost of this project in millions.

            [$mm] Modifying this field via PUT or PATCH operation will require a rebaseline.'
        projectedTotalCost:
          type:
          - number
          - 'null'
          format: decimal
          example: 100
          description: Enter the projected total cost of this project in millions. [$mm]
        actualTotalCost:
          type:
          - number
          - 'null'
          format: float
          example: 1100
          description: Enter the actual total cost of this project in millions. [$mm]
        softwareProject:
          type:
          - bool
          - 'null'
          example: false
          description: 'Enter whether this project is developing or deploying software solutions

            as a primary focus of this project.'
        tmfInitiative:
          type: string
          format: string
          example: ''
          description: Enter a valid and existing tmfInitiative from the TMF Initiatives collection.
        rebaseLines:
          type: array
          readOnly: true
          description: A list of associated rebaseLine IDs
          items:
            type: string
        incrementalDevelopment:
          type:
          - bool
          - 'null'
          example: false
          description: Are information technology investments adequately implementing incremental development methodology?
        iterationFrequencyAmount:
          type:
          - number
          - 'null'
          format: float
          example: 2.5
          description: Enter the frequency of the incremental development release iterations
        iterationFrequencyUnits:
          type:
          - string
          - 'null'
          enum:
          - Days
          - Weeks
          - Months
          - Years
          example: Weeks
          description: Select the frequency of incremental development release iterations units
        iterativeDescription:
          type:
          - string
          - 'null'
          format: string
          example: This Project deploys following all two week sprint intervals
          maxLength: 500
          description: Please briefly describe the iterative development methodology being employed.
        isMasked:
          type: bool
          example: true
          description: A readonly boolean indicating whether the document is masked from the public.
          default: true
        costVariance:
          type: float
          format: float
          example: '0.0'
          description: Project Variance Score.
        costVarianceMonetaryAmount:
          type: float
          format: float
          example: '0.0'
          description: The Dollar amount for costVariance (numerator in costVariance calculation).
        scheduleVariance:
          type: float
          format: float
          example: '0.0'
          description: Schedule Variance Score.
        scheduleVarianceDayAmount:
          type: int
          format: int
          example: 0
          description: Schedule Variance Day amount (numerator in schedule variance score calculation).
        projectStatus:
          type:
          - string
          - 'null'
          enum:
          - Not Started
          - In Progress
          - Completed
          - Deferred
          - Canceled
          example: In Progress
          description: Enter the project's current status
        archiveProjectStatus:
          description: Enter the project's current status
          type:
          - string
          - 'null'
        created:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Created date/time
        lastModified:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Last modified date/time
        agencyCode:
          type: string
          format: string
          example: 018
          description: The agency code of the user who created the record
