openapi: 3.2.0
info:
  version: 1.0.0
  title: Umbrella Admin Website Backend API
  description: The admin API is accessible via `/api-umbrella/v1`.
security:
- api_key: []
- admin_auth_token: []
tags:
- name: website_backend
paths:
  /api-umbrella/v1/website_backends:
    get:
      tags:
      - website_backend
      summary: Get a list of all website backends
      description: 'Get a listing of all website backend records the currently authenticated admin user has permissions to.


        This API''s query parameters and responses are intended to be compatible with the DataTables server-side processing API.'
      parameters:
      - $ref: '#/components/parameters/datatables-start'
      - $ref: '#/components/parameters/datatables-length'
      - $ref: '#/components/parameters/datatables-search-value'
      - $ref: '#/components/parameters/datatables-order-column'
      - $ref: '#/components/parameters/datatables-order-dir'
      - $ref: '#/components/parameters/datatables-columns-data'
      - $ref: '#/components/parameters/datatables-columns-name'
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                title: Response
                type: object
                properties:
                  draw:
                    type: integer
                  recordsTotal:
                    type: integer
                  recordsFiltered:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebsiteBackend'
      operationId: getApiUmbrellaV1WebsiteBackends
      x-operation-id-source: derived
    post:
      tags:
      - website_backend
      summary: Create a new website backend
      responses:
        201:
          description: Successfully created record
      requestBody:
        content:
          application/json:
            schema:
              title: Request
              type: object
              properties:
                website_backend:
                  $ref: '#/components/schemas/WebsiteBackend'
        description: Website backend object to create
        required: true
      operationId: postApiUmbrellaV1WebsiteBackends
      x-operation-id-source: derived
  /api-umbrella/v1/website_backends/{id}:
    parameters:
    - name: id
      in: path
      description: UUID of the website backend
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - website_backend
      summary: Get the website backend
      responses:
        200:
          description: Successful response
          content:
            application/json:
              schema:
                title: Response
                type: object
                properties:
                  website_backend:
                    type: object
                    $ref: '#/components/schemas/WebsiteBackend'
      operationId: getApiUmbrellaV1WebsiteBackendsById
      x-operation-id-source: derived
    put:
      tags:
      - website_backend
      summary: Update the website backend
      responses:
        204:
          description: Successfully updated record
      requestBody:
        content:
          application/json:
            schema:
              title: Request
              type: object
              properties:
                website_backend:
                  $ref: '#/components/schemas/WebsiteBackend'
        description: Website backend object to update
        required: true
      operationId: putApiUmbrellaV1WebsiteBackendsById
      x-operation-id-source: derived
    delete:
      tags:
      - website_backend
      summary: Delete the website backend
      responses:
        204:
          description: Successfully deleted record
      operationId: deleteApiUmbrellaV1WebsiteBackendsById
      x-operation-id-source: derived
components:
  parameters:
    datatables-order-column:
      name: order[i][column]
      in: query
      description: Size of array
      required: false
      schema:
        type: integer
    datatables-columns-name:
      name: columns[i][name]
      in: query
      description: The human-readable name of the column displayed at index `i`
      required: false
      schema:
        type: string
    datatables-length:
      name: length
      in: query
      description: Limit the number of records returned for pagination
      required: false
      schema:
        type: integer
    datatables-columns-data:
      name: columns[i][data]
      in: query
      description: The database field name of the column displayed at index `i`
      required: false
      schema:
        type: string
    datatables-start:
      name: start
      in: query
      description: Offset for pagination (0 based - 0 is the first record)
      required: false
      schema:
        type: integer
    datatables-order-dir:
      name: order[i][dir]
      in: query
      description: Size of array
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
    datatables-search-value:
      name: search[value]
      in: query
      description: Perform a text search across all records for this string
      required: false
      schema:
        type: string
  schemas:
    UpdatedAt:
      type: string
      format: date-time
      readOnly: true
      description: The time the record was last updated (ISO 8601 format)
    CreatedAt:
      type: string
      format: date-time
      readOnly: true
      description: The time the record was created (ISO 8601 format)
    AdminCreator:
      type: object
      readOnly: true
      properties:
        username:
          type: string
          format: email
          readOnly: true
          description: E-mail address of the admin that created the record
    WebsiteBackend:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        frontend_host:
          type: string
        backend_protocol:
          type: string
          enum:
          - http
          - https
        server_host:
          type: string
        server_port:
          type: integer
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        creator:
          $ref: '#/components/schemas/AdminCreator'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        updater:
          $ref: '#/components/schemas/AdminUpdater'
    AdminUpdater:
      type: object
      readOnly: true
      properties:
        username:
          type: string
          format: email
          readOnly: true
          description: E-mail address of the admin that last updated the record
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-Api-Key
    admin_auth_token:
      type: apiKey
      in: header
      name: X-Admin-Auth-Token
