      description: The production Touchpoints API
  /services:
    get:
      summary: List services
      description: Returns a list of services registered in Touchpoints.
      tags:
      - Services
      security:
      - api_key: []
      parameters:
      - name: hisp
        in: query
        required: false
        description: If set to 1, returns only HISP services. If not set or set to 0, returns all services.
        schema:
          type: integer
      responses:
        '200':
          description: successful
          content:
            application/json:
              example:
                value:
                  data:
                  - id: '1'
                    type: services
                    attributes:
                      name: Navigating information and tasks during critical life experiences
                      description: Many users interact with government when they are experiencing a significant life event – such as the birth of a child, marriage or divorce, financial hardship or the loss of a loved one – and frequently, these experiences lead them across Federal agencies in a disconnected journey of discrete tasks. Because USAGov already provides content on common tasks and are not affiliated with any particular agency, USAGov is ideally positioned as a navigational aid for these users.
                      organization_id: 1
                      organization_abbreviation: GSA
                      organization_name: General Service Administration
                      service_provider_id: 1
                      service_provider_name: Public Experience Portfolio
                      service_provider_slug: gsa-usagov
                      short_description: ''
                      year_designated: null
                      previously_reported: false
