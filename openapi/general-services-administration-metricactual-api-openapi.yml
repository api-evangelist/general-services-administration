components:
  schemas:
    MetricActual-read:
      type: object
      description: ''
      additionalProperties: false
      properties:
        created:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Created date/time
        lastModified:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Last modified date/time
        agencyCode:
          type: string
          format: string
          example: 018
          description: The agency code of the user who created the record
        agencyId:
          type: string
          format: alphanumeric
          minLength: 1
          maxLength: 64
        result:
          type: number
          format: decimal
          description: Enter the actual result measured
          example: 100
        date:
          type: string
          format: date
          description: Date of Actual Result Enter the end date of the most recent reporting period
          example: '2020-09-30'
        comment:
          type: string
          format: string
          example: September 2020 result
          description: Provide a comment for results that have not met their target
        metTarget:
          type: string
          formate: string
          example: MET
          readOnly: true
          description: A readonly boolean indicating whether the document is masked from the public.
          default: N/A
        rebaseLines:
          type: array
          readOnly: true
          description: A list of associated rebaseLine IDs
          items:
            type: string
