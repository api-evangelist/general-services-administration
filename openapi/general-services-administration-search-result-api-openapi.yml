openapi: 3.2.0
info:
  title: AG Listings Search Result API
  version: 4.0.0
servers:
- url: /api/v4.0/listings
tags:
- name: search-result
paths:
  /{workgroup}?search={keyword}:
    get:
      tags:
      - search-result
      summary: Retrieve listings of a content type (workgroup) based on keyword
      parameters:
      - in: path
        name: workgroup
        description: Content Type (workgroup) to search in
        required: true
        schema:
          type: string
      - in: query
        name: keyword
        description: Keywords to filter the search results
        required: false
        schema:
          type: string
      responses:
        '200':
          description: List of search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workgroup'
      operationId: getByWorkgroup}?search={keyword
      x-operation-id-source: derived
  /{workgroup}/resource/{pid}:
    get:
      tags:
      - search-result
      summary: Retrieve a specific listing by PID
      parameters:
      - in: path
        name: workgroup
        description: Content Type (workgroup) to search in
        required: true
        schema:
          type: string
      - in: path
        name: pid
        description: ID of the listing to retrieve
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Listing details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '404':
          description: Listing not found
      operationId: getByWorkgroupResourceByPid
      x-operation-id-source: derived
components:
  schemas:
    Detail:
      properties:
        pid:
          description: Listing Unique Identifier
          type: integer
        title:
          description: Listing title
          type: string
        description:
          description: Listing description
          type: string
    Workgroup:
      properties:
        pid:
          description: Listing Unique Identifier
          type: integer
        title:
          description: Listing title
          type: string
        summary:
          description: Listing summary
          type: string
