                  hydra:request_id:
                    type: string
                    example: xzf6bgh6-8ba2-83jn-p5a1-e4ac0f74nf5g
            application/json:
              schema:
                type: object
                properties:
                  '@context':
                    type: string
                    example: /contexts/Error
                  '@type':
                    type: string
                    example: hydra:Error
                  hydra:title:
                    type: string
                    example: InternalServerErrorException
                  hydra:description:
                    type: string
                    example: Internal Server Error
                  hydra:request_id:
                    type: string
                    example: xzf6bgh6-8ba2-83jn-p5a1-e4ac0f74nf5g
      summary: Retrieves the collection of MetricFeed resources
      description: Retrieves the collection of MetricFeed resources.
      parameters:
      - name: agency
        in: query
        description: Three digit agency code
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - '006'
          - '007'
          - 009
          - '010'
          - '011'
          - '012'
          - '014'
          - '015'
          - '016'
          - 018
          - 019
          - '020'
          - '021'
          - '023'
          - '024'
          - '025'
          - '026'
          - '027'
          - 028
          - 029
          - '100'
          - '184'
          - '202'
          - '393'
          - '422'
          - '429'
        style: form
        explode: false
        allowReserved: false
      - name: metTarget
        in: query
        description: Wether or not the actual has MET, NOT MET or is N/A relative to the target
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - MET
          - NOT MET
          - N/A
        style: form
        explode: false
        allowReserved: false
      - name: performanceMeasurementCategory
        in: query
        description: Identify the measurement category of this metric
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - Customer Satisfaction
          - Strategic and Business Results
          - Financial Performance
          - Innovation
        style: form
        explode: false
        allowReserved: false
      - name: serviceId
        in: query
        description: The Service agencyId associated with the Metric Doc
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: agencyId
        in: query
        description: The metric agencyId.
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: lastModifiedPrior
        in: query
        description: Enter Date to Compare lastModifiedPrior
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: lastModifiedSince
        in: query
        description: Enter Date to Compare lastModifiedSince
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: integer
          default: 1
        style: form
        explode: false
        allowReserved: false
      - name: agency[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: serviceId[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: agencyId[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: performanceMeasurementCategory[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: metTarget[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: sort[lastModified]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - asc
          - desc
        style: form
        explode: false
        allowReserved: false
      - name: sort[created]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - asc
          - desc
        style: form
        explode: false
        allowReserved: false
      deprecated: false
components:
  schemas:
    MetricFeed-metricFeed_readItem:
      type: object
      description: ''
      properties:
        serviceId:
          readOnly: true
          description: A readonly boolean indicating whether the document is masked from the public.
          type: string
        metTarget:
          readOnly: true
          description: A readonly boolean indicating whether the document is masked from the public.
          default: 'null'
          example: 'null'
          type: string
        actualResult:
          readOnly: true
          description: A readonly boolean indicating whether the document is masked from the public.
          type: number
        actualDate:
          readOnly: true
          description: A readonly boolean indicating whether the document is masked from the public.
          default: 'null'
          example: 'null'
          type: string
        rebaseLines:
          type: array
          example:
          - 018-000001234
          readOnly: true
          description: A list of associated rebaseLine IDs
          items:
            type: string
        agencyId:
          type: string
          format: alphanumeric
          minLength: 1
          maxLength: 32
          description: Enter a required Unique ID provided by Agency for the metric
        serviceAgencyId:
          type: string
          example: Service22304
          description: Enter the Service ID of the investment that this performance metric applies to here
        isRetired:
          type: bool
          example: false
          description: Set this value to true when this performance metrics is no longer useful for investment management.
        created:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Created date/time
        lastModified:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Last modified date/time
        agencyCode:
          type: string
          format: string
          example: 018
          description: The agency code of the user who created the record
