      summary: Retrieves the collection of OperationalAnalysisFeed resources
      description: Retrieves the collection of OperationalAnalysisFeed resources.
      parameters:
      - name: agency
        in: query
        description: Three digit agency code
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - '006'
          - '007'
          - 009
          - '010'
          - '011'
          - '012'
          - '014'
          - '015'
          - '016'
          - 018
          - 019
          - '020'
          - '021'
          - '023'
          - '024'
          - '025'
          - '026'
          - '027'
          - 028
          - 029
          - '100'
          - '184'
          - '202'
          - '393'
          - '422'
          - '429'
        style: form
        explode: false
        allowReserved: false
      - name: year
        in: query
        description: Order by Year
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          name: year
          enum:
          - ASC
          - DESC
        style: form
        explode: false
        allowReserved: false
      - name: recentFilter
        in: query
        description: OperationalAnalysis Recent Filter
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: bool
          enum:
          - 'true'
          - 'false'
        style: form
        explode: false
        allowReserved: false
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: integer
          default: 1
        style: form
        explode: false
        allowReserved: false
      - name: agency[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: agencyId
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: agencyId[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: sort[lastModified]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - asc
          - desc
        style: form
        explode: false
        allowReserved: false
      deprecated: false
components:
  schemas:
    OperationalAnalysisFeed-operAnalysisFeed_read:
      type: object
      description: ''
      properties:
        serviceId:
          readOnly: true
          description: The three digit agency code.
          type: string
        agency:
          readOnly: true
          description: The three digit agency code.
          type: string
        created:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Created date/time
        lastModified:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Last modified date/time
        agencyCode:
          type: string
          format: string
          example: 018
          description: The agency code of the user who created the record
        agencyId:
          type: string
          format: alphanumeric
          minLength: 1
          maxLength: 64
          description: A unique identifier for the document provided by the submitting user.
        date:
          type: string
          format: date
          example: '2020-08-15'
          description: The date [YYYY-MM-DD] that the operational analysis is submitted
        analysisResults:
          type: string
          format: string
          example: Sample description of the analysis results
          description: The results of the operational analysis
        analysisConclusion:
          type: string
          enum:
          - continue as-is
          - initiate remediation action
          - initiate innovation action
          - initiate modernization/replacement action
          - initiate disposal action
          example: continue as-is
          description: The conclusion of the operational analysis
      required:
      - date
      - analysisResults
