        in: query
        description: Three digit agency code
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - '005'
          - '006'
          - '007'
          - 009
          - '010'
          - '011'
          - '012'
          - '014'
          - '015'
          - '016'
          - 018
          - 019
          - '020'
          - '021'
          - '023'
          - '024'
          - '025'
          - '026'
          - '027'
          - 028
          - 029
          - '184'
          - '202'
          - '393'
          - '422'
          - '429'
        style: form
        explode: false
        allowReserved: false
      - name: type
        in: query
        description: The type field in the ledger document
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - O&M
          - DME
        style: form
        explode: false
        allowReserved: false
      - name: source
        in: query
        description: This value should be 'Internal Funding' or 'Contributions'.
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - Internal Funding
          - Contributions
        style: form
        explode: false
        allowReserved: false
      - name: year
        in: query
        description: Year of the ledger histories to be included
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: int
        style: form
        explode: false
        allowReserved: false
      - name: fundingSource
        in: query
        description: The funding source to be included
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: currentUII
        in: query
        description: Current UII of the service
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: integer
          default: 1
        style: form
        explode: false
        allowReserved: false
      deprecated: false
