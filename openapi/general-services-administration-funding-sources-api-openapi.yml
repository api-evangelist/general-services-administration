components:
  schemas:
    FundingSources.jsonld-readItem_readItemSubRes:
      type: object
      description: ''
      properties:
        '@context':
          readOnly: true
          oneOf:
          - type: string
          - type: object
            properties:
              '@vocab':
                type: string
              hydra:
                type: string
                enum:
                - http://www.w3.org/ns/hydra/core#
            required:
            - '@vocab'
            - hydra
            additionalProperties: true
        '@id':
          readOnly: true
          type: string
        '@type':
          readOnly: true
          type: string
        fundingSourceName:
          description: 'Functional/Business Sponsor Name The Functional/Business Sponsor is defined in Appendix C, and

            provides visibility for Agencies and OMB as to who the sponsor is for each Investment within the IT portfolio.'
          type:
          - string
          - 'null'
    FundingSources.jsonld-read:
      type: object
      description: ''
      properties:
        '@id':
          readOnly: true
          type: string
        '@type':
          readOnly: true
          type: string
        fundingSource:
          type: string
          example: 023-00-0000
          description: 'For ledger items selecting Funding Sources Reporting, indicate the Funding Source associated with a

            given ledger item.'
        fundingSourceName:
          description: 'Functional/Business Sponsor Name The Functional/Business Sponsor is defined in Appendix C, and

            provides visibility for Agencies and OMB as to who the sponsor is for each Investment within the IT portfolio.'
          type:
          - string
          - 'null'
        isActive:
          default: true
          example: true
          type: boolean
