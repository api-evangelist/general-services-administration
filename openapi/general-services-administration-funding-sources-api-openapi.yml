      summary: Retrieves the collection of FundingSources resources
      description: Retrieves the collection of FundingSources resources.
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: integer
          default: 1
        style: form
        explode: false
        allowReserved: false
      deprecated: false
