      summary: Retrieves the collection of ItTowerLongitudinalReport resources
      description: Retrieves the collection of ItTowerLongitudinalReport resources.
      parameters:
      - name: investmentType
        in: query
        description: The service investment type. Two digit string.
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - '01'
          - '02'
          - '03'
          - '04'
          - '05'
        style: form
        explode: false
        allowReserved: false
      - name: reporting-level
        in: query
        description: Set the lowest-level reporting aggregation to Agency or Bureau.
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - Bureau
          - Agency
        style: form
        explode: false
        allowReserved: false
      - name: currentUII
        in: query
        description: Current UII of the service
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: agency
        in: query
        description: Three digit agency code
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - '005'
          - '006'
          - '007'
          - 009
          - '010'
          - '011'
          - '012'
          - '014'
          - '015'
          - '016'
          - 018
          - 019
          - '020'
          - '021'
          - '023'
          - '024'
          - '025'
          - '026'
          - '027'
          - 028
          - 029
          - '100'
          - '184'
          - '202'
          - '393'
          - '422'
          - '429'
        style: form
        explode: false
        allowReserved: false
      - name: bureauCode
        in: query
        description: Two digit bureau code
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: agencyId
        in: query
        description: Agency ID submitted with the service
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: missionSupportCategories
        in: query
        description: Mission Support Categories
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - ''
          - '01'
          - '02'
          - '03'
          - '04'
          - '05'
          - '06'
          - '07'
          - 08
          - 09
        style: form
        explode: false
        allowReserved: false
      - name: changeInStatuses
        in: query
        description: Denotes change in status of an investment.
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: false
        allowReserved: false
      deprecated: false
components:
  schemas:
    ItTowerLongitudinalReport.jsonld-read:
      type: object
      description: ''
      additionalProperties: false
      properties:
        '@id':
          readOnly: true
          type: string
        '@type':
          readOnly: true
          type: string
