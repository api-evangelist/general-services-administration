components:
  schemas:
    Bureaus-read:
      type: object
      description: ''
      additionalProperties: false
      properties:
        bureauCode:
          type: string
          format: number
          example: '00'
          minLength: '2'
          maxLength: '2'
          description: 'Bureau Code (string) - 2 digit code

            The two digits indicate the bureau code of the Investment (see Appendix C of OMB Circular No. A-11).

            If this is a department-level or an Agency-wide  activity, use “00” as your bureau code.'
        agencyCode:
          type: string
          format: numeric
          enum:
          - '005'
          - '006'
          - '007'
          - 009
          - '010'
          - '011'
          - '012'
          - '014'
          - '015'
          - '016'
          - 018
          - 019
          - '020'
          - '021'
          - '023'
          - '024'
          - '025'
          - '026'
          - '027'
          - 028
          - 029
          - '100'
          - '184'
          - '202'
          - '393'
          - '422'
          - '429'
          example: 018
          description: The three digit agency code.
        bureauName:
          type: string
          format: string
          example: IT Collect Development
          description: This is a text field to provide the Bureau Name
    Bureaus:
      type: object
      description: ''
      additionalProperties: false
      properties:
        id:
          readOnly: true
          type: string
        bureauCode:
          type: string
          format: number
          example: '00'
          minLength: '2'
          maxLength: '2'
          description: 'Bureau Code (string) - 2 digit code

            The two digits indicate the bureau code of the Investment (see Appendix C of OMB Circular No. A-11).

