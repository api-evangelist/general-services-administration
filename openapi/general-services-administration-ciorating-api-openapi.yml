components:
  schemas:
    CioRating-read:
      type: object
      description: ''
      properties:
        agencyId:
          description: A unique identifier for the document provided by the submitting user.
          type: string
        rating:
          type: number
          format: integer
          example: 5
          minimum: 1
          maximum: 5
          description: 'CIOs best judgment of the current level of risk for the Investment in terms of its ability

            to accomplish its goals (per 40 U.S.C. § 11315 (c)(2)).


            1 represents the lowest possible score and 5 represent the highest possible score.'
        comment:
          type: string
          format: string
          example: CIO Evaluation Report on 10/1/2020 produced a score of 5.
          description: Explanation and/or additional details regarding this reported value
        date:
          type: date
          format: string
          example: '2020-10-01'
          description: Provide the date of CIO Evaluation
        created:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Created date/time
        lastModified:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Last modified date/time
        agencyCode:
          type: string
          format: string
          example: 018
          description: The agency code of the user who created the record
