      summary: Retrieves the collection of ContractsFeed resources
      description: Retrieves the collection of ContractsFeed resources.
      parameters:
      - name: agency
        in: query
        description: Three digit agency code
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - '006'
          - '007'
          - 009
          - '010'
          - '011'
          - '012'
          - '014'
          - '015'
          - '016'
          - 018
          - 019
          - '020'
          - '021'
          - '023'
          - '024'
          - '025'
          - '026'
          - '027'
          - 028
          - 029
          - '100'
          - '184'
          - '202'
          - '393'
          - '422'
          - '429'
        style: form
        explode: false
        allowReserved: false
      - name: PIID
        in: query
        description: PIID of a contract
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: integer
          default: 1
        style: form
        explode: false
        allowReserved: false
      - name: PIID[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: agency[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: agencyId
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: agencyId[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: sort[lastModified]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - asc
          - desc
        style: form
        explode: false
        allowReserved: false
      deprecated: false
components:
  schemas:
    ContractsFeed-contractFeed_read:
      type: object
      description: ''
      properties:
        serviceId:
          readOnly: true
          description: The three digit agency code.
          type: string
        contractPIID:
          readOnly: true
          description: The three digit agency code.
          type: string
        created:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Created date/time
        lastModified:
          type: string
          format: timestamp
          example: '2020-01-01 15:00:00'
          readOnly: true
          description: Last modified date/time
        agencyCode:
          type: string
          format: string
          example: 018
          description: The agency code of the user who created the record
        agencyId:
          type: string
          format: alphanumeric
          minLength: 1
          maxLength: 64
          description: A unique identifier for the document provided by the submitting user.
        PIID:
          type: string
          format: string
          example: IT-00-000-00
          description: 'The unique identifier for each contract, agreement, or order associated with this

            Investment (Federal Procurement Data Systems (FPDS) data element 1A).

            Enter PIID numbers for contacts, agreements, or orders both that have already been awarded.

            Completed and/or expired contracts do not need to be included.

            Data definitions can be found at Federal Procurement Data System.

            Please note that reference PIIDs should not be entered for this field.'
        referencePIID:
          type:
          - string
          - 'null'
          format: string
          example: IT-123-000
          description: 'For each PIID number reported for contract support obtained via an order or call,

            report the Reference PIID per FPDS instructions for element 1c.'
