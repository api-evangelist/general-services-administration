aid: general-services-administration
name: General Services Administration
description: The General Services Administration (GSA) provides workplaces by constructing, managing,
  and preserving government buildings and by leasing and managing commercial real estate. GSA acquisition
  solutions offer private sector professional services, equipment, supplies, and IT to government organizations
  and the military. GSA also promotes management best practices and efficient government operations through
  the development of governmentwide policies, including a broad portfolio of public APIs.
