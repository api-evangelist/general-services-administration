- aid: general-services-administration:searchgov-suggestions-api
  name: Search.gov Type-Ahead Suggestions API
  description: >-
    Exposes the type-ahead suggestions that can appear below your search box as searchers enter their
    search terms. RETIRED: probed 2026-09-12 — https://open.gsa.gov/api/searchgov-suggestions/ and its
    OpenAPI both return HTTP 404, and the API is no longer listed in the open.gsa.gov directory. Search.gov
    developer material now redirects to digital.gov.
  humanURL: https://open.gsa.gov/api/
  tags:
  - Search
- aid: general-services-administration:tmss-rate-query-api
  name: TMSS 2.0 Rate Query API
