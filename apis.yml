    The Rate Query API offered by TMSS 2.0 is used to retrieve shipment cost for a regular Household Goods
    (HHG) shipment or for an Extended Storage (EXSTG) shipment for Federal Civilian Agencies.
  humanURL: https://open.gsa.gov/api/ratequeryhhg/
  tags:
  - Logistics
  - Shipping
  properties:
  - type: Documentation
    url: https://open.gsa.gov/api/ratequeryhhg/
  baseURL: https://api.gsa.gov/travel/tmss/v1
- aid: general-services-administration:sustainable-facilities-api
  name: Sustainable Facilities Tool API
  description: >-
    Offers sustainable guidance and tools for various roles via the Sustainable Facilities Tool (SFTool).
    RETIRED: probed 2026-09-12 — https://sftool.gov/developers returns HTTP 200 but serves a catch-all
    "Clearinghouse | GSA" page for every path on the host, including bogus ones. The developer API and
    its documentation are gone and GSA published no retirement notice.
  humanURL: https://open.gsa.gov/api/
  tags:
  - Sustainability
  - Facilities
