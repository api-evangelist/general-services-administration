- aid: general-services-administration:general-services-administration-forms-api
  name: General Services Administration Forms API
  description: >-
    Forms (also called surveys) are used to collect user feedback. With a Touchpoints account, you can

    create a form, publish it in one of several digital formats and view form responses submitted by your
    users. You can also share

    your form with other Touchpoints users so that it may be managed collectively by your team.


    Use the following endpoints to view your forms and form responses. Standard users can see forms for
    which they are a Form Manager or Response Viewer. Users with the Organization Admin role can see all
    forms belonging to their organization.


    Forms are identified by their short UUID, which is the 8-character string of letters and numbers used
    in Touchpoints form URLs. For instance, if your form lives at https://touchpoints.app.cloud.gov/admin/forms/8fc3c208,
    its short UUID is '8fc3c208'.


    Note that all Form endpoints are read-only. To create, edit or share a form, you must use the [Touchpoints
    web app](https://touchpoints.app.cloud.gov/).
  humanURL: https://open.gsa.gov/api/ag-api/
  baseURL: https://api.gsa.gov/acquisitiongateway/api/v4.0
