generated: '2026-09-12'
method: searched
source: >-
  Searched npm (registry.npmjs.org), PyPI, Packagist, RubyGems and the GSA /
  GSA-TTS GitHub organizations for first-party client libraries against the GSA
  API surface documented at https://open.gsa.gov/api/.
description: >-
  GSA publishes no first-party API client SDK in any language registry. Every
  API on open.gsa.gov is documented as a plain HTTPS call carrying an
  api.data.gov key, and none of the 28 API pages links a client library. What
  GSA does publish to npm is front-end material — USWDS-based UI component
  libraries for SAM.gov and for GSA-TTS products — which is captured here and,
  in more detail, in components/. The only GSA-authored code that behaves like a
  client is the GSA-TTS MCP server set (see mcp/), which is distributed as
  source and as a container image rather than as a registry package.
