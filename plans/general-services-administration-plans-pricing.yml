specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: General Services Administration
providerId: general-services-administration
generated: '2026-09-12'
created: '2026-05-04'
modified: '2026-09-12'
method: searched
source: >-
  https://api.data.gov/signup/, https://api.data.gov/docs/developer-manual/ and
  https://open.gsa.gov/api/ — checked for any published price, tier or paid
  upgrade path across the GSA developer surface. Replaces the 2026-05-04
  scaffold, which invented "professional" and "enterprise" tiers.
description: >-
  GSA publishes no pricing of any kind for its APIs, and that is the finding,
  not a gap in our research. Every API in this record is a free public
  government service: you self-register an api.data.gov key (or a SAM.gov
  account key), you are metered, and there is no paid tier to buy. The
  documented escalation path for more capacity is an email to the owning agency,
  not a checkout.
plan_count: 1
pricing_model: free-public-service
currency: USD
plans:
  - id: general-services-administration-public
    name: Public API key
    type: free
    price: '0.00'
    currency: USD
    billing_period: none
    signup: https://api.data.gov/signup/
    description: >-
      A single self-service api.data.gov key that works across every
      participating federal API, GSA's included. No card, no contract, no tier.
    included:
      - label: Requests
        metric: requests_per_hour
        limit: 1000
        note: See rate-limits/general-services-administration-rate-limits.yml; SAM.gov meters daily instead.
    overage: >-
      None. Exceeding the allowance returns HTTP 429 OVER_RATE_LIMIT and the key
      is temporarily blocked until the rolling window clears.
    limits_ref: rate-limits/general-services-administration-rate-limits.yml
enterprise_contact_only: false
notes:
  - >-
    Some GSA data behind these APIs is access-controlled rather than priced —
    SAM.gov FOUO and CUI-Sensitive entity data requires a role and a system
    account, and the TMSS 2.0 Rate Query API requires a signed MOU with GSA FAS.
    Those are eligibility gates, not plans.
