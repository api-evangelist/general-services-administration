description: >-
  GSA publishes no agency-level changelog. What exists is a per-API dated change
  log, maintained by the SAM.gov / Integrated Award Environment program on the
  open.gsa.gov page for each of its APIs, with a document version number that is
  distinct from the API's own path version. Non-SAM.gov programs (per diem, DAP,
  Site Scanning, Search.gov, Data.gov, Touchpoints, IT Collect) publish no
  changelog at all. The most recent entry anywhere in the estate is 2024-12-06.
scheme: per-API document version (vX.Y), dated, most recent last
estate_wide: false
